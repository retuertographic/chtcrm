<script>
  /* Los artículos se leen de novedades-data.json: para publicar uno nuevo
     basta con añadir su entrada ahí y crear novedades/<slug>.html */
  let novedadesCache = null;

  async function renderPosts(lang){
    const grid = document.getElementById('novGrid');
    const t = I18N[lang] || I18N.es;
    try{
      if (!novedadesCache){
        const res = await fetch('novedades-data.json', { cache: 'no-store' });
        novedadesCache = (await res.json()).posts || [];
      }
      const posts = [...novedadesCache].sort((a,b) => new Date(b.date) - new Date(a.date));
      if (!posts.length){
        grid.innerHTML = `<div class="nov-empty">${t.novedades_empty}</div>`;
        return;
      }
      grid.innerHTML = posts.map(p => {
        const title = lang === 'en' ? (p.title_en || p.title_es) : p.title_es;
        const excerpt = lang === 'en' ? (p.excerpt_en || p.excerpt_es) : p.excerpt_es;
        const dateStr = new Date(p.date + 'T00:00:00').toLocaleDateString(lang === 'en' ? 'en-GB' : 'es-ES', {day:'numeric', month:'long', year:'numeric'});
        /* sin imagen no se pinta la miniatura: mejor una tarjeta de texto limpia
           que un bloque vacío que parezca una imagen rota */
        const thumb = p.image
          ? `<div class="thumb"><img src="${p.image}" alt="${title}" width="1200" height="750" loading="lazy"></div>`
          : '';
        return `<article class="nov-card">
          ${thumb}
          <div class="body">
            <div class="nov-date">${dateStr}</div>
            <h3>${title}</h3>
            <p>${excerpt}</p>
            <a class="read-more" href="novedades/${p.slug}.html">${t.read_more}</a>
          </div>
        </article>`;
      }).join('');
    }catch(err){
      grid.innerHTML = `<div class="nov-empty">${t.novedades_empty}</div>`;
    }
  }
  function onLanguageChange(lang){ renderPosts(lang); }
</script>
