<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 · Acceso restringido · Chat CRM</title>
<meta name="description" content="Acceso restringido — Chat CRM by Retuerto Graphic Design.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%235B7CFA'/%3E%3Cpath d='M78 46.5a30 30 0 0 1-3.2 13.5 30.5 30.5 0 0 1-27.3 16.9 30 30 0 0 1-13.5-3.2L20 78l6.8-20.4A30 30 0 0 1 23.6 44 30.5 30.5 0 0 1 40.5 16.7 30 30 0 0 1 54 13.5h1.8A30.4 30.4 0 0 1 84 41.9z' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Estilos propios y completos: esta página no depende de assets/site.css,
     para que siga viéndose bien aunque el resto del sitio no cargue. */
  :root{--ink:#0B1020;--brand:#5B7CFA;--brand-2:#25D3A3;--brand-soft:#8FA6FF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--ink);color:#fff;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 24px;position:relative;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(55% 50% at 20% 15%, rgba(91,124,250,.38), transparent 60%),
      radial-gradient(45% 45% at 82% 22%, rgba(37,211,163,.22), transparent 60%);
  }
  body::after{
    content:'';position:absolute;inset:0;pointer-events:none;opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(70% 60% at 50% 40%, #000, transparent 75%);
    mask-image:radial-gradient(70% 60% at 50% 40%, #000, transparent 75%);
  }
  main{position:relative;z-index:2;max-width:620px;}
  .brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:38px;color:inherit;text-decoration:none;}
  .brand .badge{
    width:42px;height:42px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 8px 20px rgba(91,124,250,.35);
  }
  .brand .badge svg{width:21px;height:21px;}
  .brand .txt{text-align:left;line-height:1.15;}
  .brand strong{display:block;font-family:'Sora',system-ui,sans-serif;font-size:1rem;letter-spacing:-.01em;}
  .brand span{display:block;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);}
  .code{
    font-family:'Sora',system-ui,sans-serif;font-weight:700;line-height:1;letter-spacing:-.04em;
    font-size:clamp(5rem,18vw,9rem);
    background:linear-gradient(120deg,var(--brand-soft),var(--brand-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
  }
  h1{font-family:'Sora',system-ui,sans-serif;font-weight:700;font-size:clamp(1.4rem,4vw,2.1rem);letter-spacing:-.02em;margin-bottom:16px;}
  p{color:rgba(255,255,255,.7);font-size:1.02rem;line-height:1.8;margin:0 auto 34px;max-width:480px;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--brand);color:#fff;font-weight:600;font-size:.95rem;font-family:inherit;
    padding:13px 28px;border-radius:12px;border:none;cursor:pointer;text-decoration:none;
    box-shadow:0 12px 26px rgba(91,124,250,.32);
    transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(91,124,250,.42);background:#6E8BFF;}
  .btn.outline{background:transparent;border:1.5px solid rgba(255,255,255,.35);box-shadow:none;}
  .btn.outline:hover{background:rgba(255,255,255,.1);border-color:#fff;}
  .links{margin-top:36px;padding-top:26px;border-top:1px solid rgba(255,255,255,.12);}
  .links a{color:rgba(255,255,255,.65);font-size:.88rem;text-decoration:none;margin:0 12px;transition:color .2s ease;}
  .links a:hover{color:var(--brand-2);}
  .lang{
    position:fixed;top:20px;right:20px;z-index:5;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;
    padding:7px 13px;border-radius:30px;font-family:inherit;font-weight:600;font-size:.78rem;cursor:pointer;
  }
  .lang:hover{background:rgba(255,255,255,.18);}
</style>
</head>
<body>

<button class="lang" id="langBtn" type="button">🇬🇧 EN</button>

<main>
  <a class="brand" href="https://retuertographic.github.io/chtcrm/">
    <span class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </span>
    <span class="txt"><strong>Chat CRM</strong><span>by Retuerto Graphic Design</span></span>
  </a>

  <div class="code">403</div>
  <h1 id="t">No tienes acceso a esta página</h1>
  <p id="p">Esta dirección está restringida. Si crees que deberías poder verla, escríbenos y lo revisamos.</p>

  <div class="actions">
    <a class="btn" href="https://retuertographic.github.io/chtcrm/" id="b1">Ir al inicio</a>
    <button class="btn outline" type="button" id="b2" onclick="history.back()">Volver atrás</button>
  </div>

  <div class="links">
    <a href="https://retuertographic.github.io/chtcrm/#funcionalidades" id="l1">Funcionalidades</a>
    <a href="https://retuertographic.github.io/chtcrm/novedades.html" id="l2">Novedades</a>
    <a href="https://retuertographic.github.io/chtcrm/#contacto" id="l3">Contacto</a>
  </div>
</main>

<script>
  /* Sin dependencias: los dos idiomas viajan dentro de la propia página. */
  var T = {
    es: { t: "No tienes acceso a esta página", p: "Esta dirección está restringida. Si crees que deberías poder verla, escríbenos y lo revisamos.",
           b1: 'Ir al inicio', b2: 'Volver atrás',
           l1: 'Funcionalidades', l2: 'Novedades', l3: 'Contacto',
           lang: '\uD83C\uDDEC\uD83C\uDDE7 EN', title: '403 · Acceso restringido · Chat CRM' },
    en: { t: "You do not have access to this page", p: "This address is restricted. If you think you should be able to see it, write to us and we will check.",
           b1: 'Go to the home page', b2: 'Go back',
           l1: 'Features', l2: 'News', l3: 'Contact',
           lang: '\uD83C\uDDEA\uD83C\uDDF8 ES', title: '403 · Access restricted · Chat CRM' }
  };

  function apply(lang) {
    var d = T[lang] || T.es;
    document.documentElement.lang = lang;
    document.title = d.title;
    document.getElementById('t').textContent = d.t;
    document.getElementById('p').textContent = d.p;
    document.getElementById('b1').textContent = d.b1;
    document.getElementById('b2').textContent = d.b2;
    document.getElementById('l1').textContent = d.l1;
    document.getElementById('l2').textContent = d.l2;
    document.getElementById('l3').textContent = d.l3;
    document.getElementById('langBtn').textContent = d.lang;
  }

  var lang = 'es';
  try {
    lang = localStorage.getItem('chatcrm_lang')
        || ((navigator.language || 'es').slice(0, 2) === 'en' ? 'en' : 'es');
  } catch (e) { /* navegación privada: nos quedamos en español */ }
  apply(lang);

  document.getElementById('langBtn').addEventListener('click', function () {
    lang = lang === 'es' ? 'en' : 'es';
    try { localStorage.setItem('chatcrm_lang', lang); } catch (e) {}
    apply(lang);
  });
</script>

</body>
</html>
